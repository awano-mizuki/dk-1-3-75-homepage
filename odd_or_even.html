
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROYAL HAN-CHO｜半か丁</title>

  <style>
    :root {
      --gold: #f4d27a;
      --gold-dark: #b78b35;
      --green: #064b35;
      --green-dark: #032b20;
      --cream: #fff7df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
      background: radial-gradient(
        ellipse at top,
        #126448 0%,
        var(--green) 45%,
        var(--green-dark) 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .table {
      width: min(100%, 780px);
      border: 3px solid var(--gold-dark);
      border-radius: 22px;
      padding: clamp(18px, 4vw, 36px);
      background: linear-gradient(
        145deg,
        rgba(4, 63, 44, .96),
        rgba(2, 37, 27, .98)
      );
      box-shadow: 0 18px 50px #0008, inset 0 0 0 5px #f4d27a18;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: .32em;
      font-size: .78rem;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: .08em;
      color: var(--gold);
      text-shadow: 0 3px 0 #6c4b18;
    }

    .subtitle {
      margin: 8px 0 26px;
      color: #d9e8dc;
      letter-spacing: .12em;
    }

    .rule {
      display: inline-block;
      border: 1px solid #b78b35aa;
      border-radius: 999px;
      padding: 7px 15px;
      margin-bottom: 20px;
      color: #f7e6b3;
      font-size: .9rem;
    }

    /* サイコロ2個の配置 */
    .dice-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 7vw, 54px);
      margin: 8px 0 24px;
      perspective: 800px;
    }

    /* サイコロ本体 */
    .die {
      width: clamp(105px, 25vw, 155px);
      aspect-ratio: 1;
      border-radius: 20px;
      background: linear-gradient(145deg, #fffef8, #e8dfca);
      border: 3px solid var(--gold);
      box-shadow:
        0 12px 0 #b6a681,
        0 18px 22px #0005,
        inset 0 2px 5px #fff;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 14px;
      transform: rotateX(5deg);
      transition: transform .15s ease;
    }

    .die.rolling {
      animation: tumble .16s linear infinite alternate;
    }

    @keyframes tumble {
      from {
        transform: rotate(-5deg) translateY(0);
      }
      to {
        transform: rotate(5deg) translateY(-5px);
      }
    }

    /* サイコロの点 */
    .pip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #19271f;
      align-self: center;
      justify-self: center;
      box-shadow: inset 0 2px 2px #0007;
      opacity: 0;
    }

    .pip.show {
      opacity: 1;
    }

    .die-label {
      color: #d9c17e;
      font-size: .78rem;
      letter-spacing: .15em;
      margin-top: 11px;
    }

    .choice-title {
      color: var(--gold);
      font-size: 1.05rem;
      margin: 12px 0;
      letter-spacing: .12em;
    }

    /* 半・丁の選択ボタン */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 460px;
      margin: 0 auto 18px;
    }

    .choice {
      cursor: pointer;
      border: 2px solid var(--gold-dark);
      border-radius: 14px;
      padding: 15px 12px;
      color: var(--cream);
      background: linear-gradient(135deg, #165b42, #073625);
      font: inherit;
      transition: .2s ease;
    }

    .choice strong {
      display: block;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: var(--gold);
      letter-spacing: .08em;
    }

    .choice span {
      font-size: .88rem;
      color: #d9e8dc;
    }

    .choice:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 6px 0 #022319;
      border-color: var(--gold);
    }

    .choice.selected {
      background: linear-gradient(135deg, #8e6b26, #4e3710);
      border-color: #fff0ad;
      box-shadow: 0 0 0 3px #f4d27a2e;
    }

    button:focus-visible {
      outline: 3px solid #fff2b9;
      outline-offset: 4px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* メインボタン */
    .main-button {
      cursor: pointer;
      width: min(100%, 300px);
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      color: #2b1c06;
      background: linear-gradient(180deg, #ffebaa, #d6a83f);
      box-shadow: 0 5px 0 #8d6720, 0 9px 18px #0004;
      font: bold 1.05rem Georgia, serif;
      letter-spacing: .1em;
      transition: transform .15s ease;
    }

    .main-button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .main-button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8d6720;
    }

    /* 結果表示 */
    .result {
      min-height: 94px;
      margin: 25px auto 18px;
      padding: 15px;
      border-top: 1px solid #b78b3566;
      border-bottom: 1px solid #b78b3566;
    }

    .result h2 {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: clamp(1.7rem, 5vw, 2.4rem);
    }

    .result p {
      margin: 0;
      color: #e4eadf;
    }

    .result .win {
      color: #b8f3c4;
    }

    .result .lose {
      color: #ffc0a9;
    }

    /* 勝率などの記録 */
    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 25px;
      margin-top: 15px;
      color: #d9e8dc;
      font-family: Arial, sans-serif;
      font-size: .9rem;
    }

    .stats strong {
      color: var(--gold);
    }

    /* 最近の結果 */
    .history {
      margin-top: 23px;
      text-align: left;
      border-radius: 12px;
      padding: 14px 16px;
      background: #001c1480;
    }

    .history h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 1rem;
    }

    #historyList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 27px;
    }

    .history-item {
      background: #f8efd8;
      color: #173226;
      border-radius: 7px;
      padding: 5px 9px;
      font-family: Arial, sans-serif;
      font-size: .86rem;
    }

    .footer-note {
      color: #b8d0c1;
      font-size: .78rem;
      margin: 19px 0 0;
      line-height: 1.6;
    }

    .btn-back {
      display: inline-block;
      margin-top: 40px;
      padding: 10px 24px;
      border: 1px solid #c7a04b;
      color: #ffe4a0;
      text-decoration: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* スマホ向け */
    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .table {
        border-radius: 16px;
      }

      .die {
        padding: 10px;
        border-radius: 15px;
      }

      .pip {
        width: 14px;
        height: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="table">
    <div class="eyebrow">THE ROYAL GAME ROOM</div>
    <h1>半か丁</h1>
    <p class="subtitle">HAN-CHO · THE DICE GUESS</p>

    <div class="rule">
      合計が「奇数＝半」「偶数＝丁」
    </div>

    <!-- サイコロ -->
    <section class="dice-area" aria-label="サイコロの結果">
      <div>
        <div class="die" id="die1" aria-label="サイコロ1">
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
        </div>
        <div class="die-label">DICE I</div>
      </div>

      <div>
        <div class="die" id="die2" aria-label="サイコロ2">
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
          <i class="pip"></i><i class="pip"></i><i class="pip"></i>
        </div>
        <div class="die-label">DICE II</div>
      </div>
    </section>

    <!-- 半か丁かを選ぶ -->
    <div class="choice-title">どちらに賭ける？</div>

    <div class="choices">
      <button
        class="choice selected"
        id="hanChoice"
        type="button"
        aria-pressed="true"
      >
        <strong>半</strong>
        <span>奇数（3・5・7・9・11）</span>
      </button>

      <button
        class="choice"
        id="choChoice"
        type="button"
        aria-pressed="false"
      >
        <strong>丁</strong>
        <span>偶数（2・4・6・8・10・12）</span>
      </button>
    </div>

    <button class="main-button" id="rollButton" type="button">
      サイコロを振る
    </button>

    <!-- 結果 -->
    <section class="result" aria-live="polite">
      <h2 id="resultTitle">半か丁か……？</h2>
      <p id="resultText">
        「半」か「丁」を選んで、サイコロを振ろう。
      </p>
    </section>

    <!-- 記録 -->
    <div class="stats">
      <span>勝ち <strong id="wins">0</strong></span>
      <span>負け <strong id="losses">0</strong></span>
      <span>勝率 <strong id="winRate">—</strong></span>
      <span>挑戦 <strong id="rounds">0</strong> 回</span>
    </div>

    <!-- 最近の結果 -->
    <section class="history">
      <h3>最近の結果</h3>
      <div id="historyList">
        <span class="history-item">まだ記録はありません</span>
      </div>
    </section>

    <button
      class="main-button"
      id="resetButton"
      type="button"
      style="margin-top:20px;background:linear-gradient(180deg,#e7e3d8,#bdb5a0);box-shadow:0 5px 0 #777064;"
    >
      記録をリセット
    </button>

    <p class="footer-note">
      このゲームは遊び用のシミュレーションです。
      お金や換金できるポイントは使いません。
    </p>

    <p class="mini-game">
      <a href="index.html">
        <button class="btn-back">ホームに戻る</button>
      </a>
    </p>
  </main>

  <script>
    // HTMLの要素を取得
    const die1 = document.getElementById("die1");
    const die2 = document.getElementById("die2");

    const hanChoice = document.getElementById("hanChoice");
    const choChoice = document.getElementById("choChoice");

    const rollButton = document.getElementById("rollButton");
    const resetButton = document.getElementById("resetButton");

    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");

    const winsDisplay = document.getElementById("wins");
    const lossesDisplay = document.getElementById("losses");
    const winRateDisplay = document.getElementById("winRate");
    const roundsDisplay = document.getElementById("rounds");

    const historyList = document.getElementById("historyList");

    // ゲームの状態
    let choice = "半";
    let wins = 0;
    let losses = 0;
    let rolling = false;
    let rollTimer = null;

    // サイコロの目ごとの点の位置
    // 0 1 2
    // 3 4 5
    // 6 7 8
    const pipPatterns = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    // サイコロの見た目を変更
    function showDie(die, value) {
      const pips = die.querySelectorAll(".pip");

      pips.forEach((pip, index) => {
        pip.classList.toggle(
          "show",
          pipPatterns[value].includes(index)
        );
      });

      die.setAttribute("aria-label", `サイコロ：${value}`);
    }

    // 半・丁を選択
    function setChoice(nextChoice) {
      if (rolling) return;

      choice = nextChoice;

      const isHan = choice === "半";

      hanChoice.classList.toggle("selected", isHan);
      choChoice.classList.toggle("selected", !isHan);

      hanChoice.setAttribute("aria-pressed", String(isHan));
      choChoice.setAttribute("aria-pressed", String(!isHan));
    }

    hanChoice.addEventListener("click", () => {
      setChoice("半");
    });

    choChoice.addEventListener("click", () => {
      setChoice("丁");
    });

    // 勝ち・負け・勝率を更新
    function updateStats() {
      const rounds = wins + losses;

      winsDisplay.textContent = wins;
      lossesDisplay.textContent = losses;
      roundsDisplay.textContent = rounds;

      winRateDisplay.textContent = rounds
        ? `${Math.round((wins / rounds) * 100)}%`
        : "—";
    }

    // 最近の結果を追加
    function addHistory(value1, value2, total, outcome, didWin) {
      const emptyMessage = historyList.querySelector("span");

      if (
        emptyMessage &&
        emptyMessage.textContent === "まだ記録はありません"
      ) {
        historyList.innerHTML = "";
      }

      const item = document.createElement("span");
      item.className = "history-item";

      item.textContent =
        `${value1} + ${value2} = ${total}（${outcome}）` +
        (didWin ? " ✓" : "");

      historyList.prepend(item);

      // 最大8件まで表示
      while (historyList.children.length > 8) {
        historyList.removeChild(historyList.lastElementChild);
      }
    }

    // サイコロを振る
    function rollDice() {
      if (rolling) return;

      rolling = true;

      rollButton.disabled = true;
      hanChoice.disabled = true;
      choChoice.disabled = true;

      die1.classList.add("rolling");
      die2.classList.add("rolling");

      resultTitle.className = "";
      resultTitle.textContent = "ころころ……";
      resultText.textContent = "サイコロを振っています。";

      let ticks = 0;

      rollTimer = window.setInterval(() => {
        // アニメーション中はランダムな目を表示
        showDie(die1, Math.floor(Math.random() * 6) + 1);
        showDie(die2, Math.floor(Math.random() * 6) + 1);

        ticks++;

        if (ticks >= 12) {
          window.clearInterval(rollTimer);
          rollTimer = null;
          finishRoll();
        }
      }, 90);
    }

    // サイコロの最終結果を決める
    function finishRoll() {
      const value1 = Math.floor(Math.random() * 6) + 1;
      const value2 = Math.floor(Math.random() * 6) + 1;

      const total = value1 + value2;

      // 合計が偶数なら丁、奇数なら半
      const outcome = total % 2 === 0 ? "丁" : "半";

      // 選んだ結果と一致するか判定
      const didWin = outcome === choice;

      showDie(die1, value1);
      showDie(die2, value2);

      die1.classList.remove("rolling");
      die2.classList.remove("rolling");

      if (didWin) {
        wins++;

        resultTitle.className = "win";
        resultTitle.textContent = "当たり！";

        resultText.textContent =
          `${value1} + ${value2} = ${total}。` +
          `結果は「${outcome}」！予想が当たった！`;
      } else {
        losses++;

        resultTitle.className = "lose";
        resultTitle.textContent = "ざんねん！";

        resultText.textContent =
          `${value1} + ${value2} = ${total}。` +
          `結果は「${outcome}」！次に挑戦しよう。`;
      }

      addHistory(value1, value2, total, outcome, didWin);
      updateStats();

      rolling = false;

      rollButton.disabled = false;
      hanChoice.disabled = false;
      choChoice.disabled = false;

      rollButton.textContent = "もう一度振る";
    }

    // 記録をすべてリセット
    function resetGame() {
      if (rollTimer !== null) {
        window.clearInterval(rollTimer);
        rollTimer = null;
      }

      rolling = false;
      wins = 0;
      losses = 0;

      updateStats();

      historyList.innerHTML =
        '<span class="history-item">まだ記録はありません</span>';

      showDie(die1, 1);
      showDie(die2, 1);

      die1.classList.remove("rolling");
      die2.classList.remove("rolling");

      rollButton.disabled = false;
      hanChoice.disabled = false;
      choChoice.disabled = false;

      rollButton.textContent = "サイコロを振る";

      resultTitle.className = "";
      resultTitle.textContent = "半か丁か……？";

      resultText.textContent =
        "「半」か「丁」を選んで、サイコロを振ろう。";
    }

    // ボタンと処理を接続
    rollButton.addEventListener("click", rollDice);
    resetButton.addEventListener("click", resetGame);

    // 最初は両方とも1の目を表示
    showDie(die1, 1);
    showDie(die2, 1);

    rollButton.addEventListener("click", rollDice);
  </script>
</body>
</html>
