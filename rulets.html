
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL SPIN | ルーレット</title>

<style>
:root {
  --gold: #f4d16f;
  --cream: #fff5d8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #173f31, #061a14 70%);
  color: var(--cream);
  font-family: system-ui, -apple-system,
    "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}

header {
  text-align: center;
  padding: 25px 12px 10px;
}

.kicker {
  font-size: .72rem;
  letter-spacing: .35em;
  color: var(--gold);
  font-weight: 800;
}

h1 {
  font: 900 clamp(2.3rem, 8vw, 4.5rem)/1.1 Georgia, serif;
  color: var(--gold);
  margin: 8px 0;
  text-shadow: 0 3px #75571a, 0 8px 24px #0008;
  letter-spacing: .06em;
}

header p {
  margin: 8px 0;
  color: #c4d9ce;
}

main {
  width: min(1000px, 94vw);
  margin: auto;
  padding-bottom: 28px;
}

.panel {
  background: #061c16e8;
  border: 1px solid #c9a94c66;
  border-radius: 18px;
  padding: 18px;
  margin: 14px 0;
  box-shadow: 0 14px 35px #0003;
}

h2 {
  color: var(--gold);
  font-size: 1.08rem;
  margin: 0 0 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}

h2:after {
  content: "";
  height: 1px;
  background: #c9a94c55;
  flex: 1;
}

.layout {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(280px, 1fr);
  gap: 18px;
  align-items: center;
}

.wheel-wrap {
  display: grid;
  place-items: center;
  position: relative;
  padding: 10px;
}

canvas {
  width: min(100%, 400px);
  height: auto;
  filter: drop-shadow(0 12px 18px #0007);
}

.pointer {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 30px solid var(--gold);
  filter: drop-shadow(0 2px 2px #0008);
}

.result {
  border: 1px solid #c9a94c77;
  background: #0b3828;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
}

.result-label {
  color: #b6d5c5;
  font-size: .85rem;
}

.number {
  font-size: 3.4rem;
  line-height: 1.2;
  font-weight: 950;
  color: white;
  text-shadow: 0 3px 10px #0007;
}

.number.red {
  color: #ff7777;
}

.number.black {
  color: #e8e8e8;
}

.number.green {
  color: #78e6a6;
}

.color-name {
  font-weight: 900;
  font-size: 1.05rem;
}

button, select {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-weight: 850;
  transition: filter .12s, transform .12s;
}

button:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.primary {
  background: linear-gradient(135deg, #ffe69a, #d5a435);
  color: #2b2108;
  box-shadow: 0 4px #8b681e;
}

.secondary {
  background: #164a37;
  color: var(--cream);
  border: 1px solid #5c9478;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.controls button {
  flex: 1;
}

select {
  background: #092d22;
  color: var(--cream);
  border: 1px solid #6a9c7e;
  border-radius: 9px;
  padding: 10px;
  width: 100%;
  margin-top: 5px;
}

.field {
  margin: 12px 0;
}

label {
  font-weight: 750;
  font-size: .9rem;
  color: #d1e3d9;
}

.chips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.chip {
  padding: 12px 5px;
  border-radius: 9px;
  text-align: center;
  font-weight: 900;
  border: 2px solid #ffffff35;
}

.chip.red {
  background: #bd252e;
  color: #fff;
}

.chip.black {
  background: #161616;
  color: #fff;
}

.chip.green {
  background: #087b46;
  color: #fff;
}

.chip.selected {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.message {
  min-height: 26px;
  color: var(--gold);
  font-weight: 800;
  text-align: center;
  margin: 14px 0 0;
}

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.stat {
  background: #ffffff0b;
  border: 1px solid #ffffff1c;
  border-radius: 9px;
  padding: 10px 12px;
  flex: 1;
  min-width: 110px;
}

.stat span {
  display: block;
  color: #a9c7b8;
  font-size: .76rem;
}

.stat strong {
  font-size: 1.2rem;
  color: var(--gold);
}

.history {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.history span {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 900;
  border: 1px solid #ffffff50;
}

.history .red {
  background: #bd252e;
}

.history .black {
  background: #171717;
}

.history .green {
  background: #087b46;
}

.note {
  font-size: .8rem;
  color: #a9c7b8;
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 0 12px 24px;
  font-size: .75rem;
  color: #89a99a;
}

.btn-back {
    display: inline-block;
    margin-top: 40px;
    padding: 10px 24px;
    border: 1px solid #c7a04b;
    color: #ffe4a0;
    text-decoration: none;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    transition: background 0.2s;
}

@media (max-width: 700px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .panel {
    padding: 14px;
  }

  .wheel-wrap {
    max-width: 430px;
    margin: auto;
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="kicker">THE CLASSIC CASINO GAME</div>
  <h1>ROYAL SPIN</h1>
  <p>ボールの行方を見届けよう。運命の数字はどこだ？</p>
</header>

<main>

  <section class="panel">
    <h2>🎡 ルーレットテーブル</h2>

    <div class="layout">

      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas
          id="wheel"
          width="600"
          height="600"
          aria-label="ルーレット盤"
        ></canvas>
      </div>

      <div>

        <div class="result" aria-live="polite">
          <div class="result-label">RESULT NUMBER</div>
          <div id="resultNumber" class="number">—</div>
          <div id="resultColor" class="color-name">
            スタートを押してね
          </div>
          <p id="resultText" class="note">
            0〜36の数字が出るよ。
          </p>
        </div>

        <div class="stats">
          <div class="stat">
            <span>ゲーム回数</span>
            <strong id="rounds">0</strong>
          </div>

          <div class="stat">
            <span>赤 / 黒 / 緑</span>
            <strong id="counts">0 / 0 / 0</strong>
          </div>
        </div>

        <div class="controls">
          <button class="primary" id="spin">
            ▶ ルーレットを回す
          </button>

          <button class="secondary" id="reset">
            ↻ リセット
          </button>
        </div>

      </div>
    </div>
  </section>

  <section class="panel">
    <h2>🎯 結果を予想（お遊びモード）</h2>

    <div class="field">
      <label for="prediction">予想する種類</label>

      <select id="prediction">
        <option value="red">赤</option>
        <option value="black">黒</option>
        <option value="green">緑（0）</option>
        <option value="even">偶数（0を除く）</option>
        <option value="odd">奇数</option>
        <option value="low">1〜18</option>
        <option value="high">19〜36</option>
        <option value="number">選んだ数字</option>
      </select>
    </div>

    <div class="field">
      <label>または、好きな数字を選ぶ</label>
      <div class="chips" id="numberChoices"></div>
    </div>

    <p id="predictionMessage" class="message">
      予想を選んで、ルーレットを回そう！
    </p>

    <p class="note">
      これは架空のカジノ風ミニゲームです。
      現実のお金や換金できるポイントは使いません。
    </p>
  </section>

  <section class="panel">
    <h2>📜 最近の結果</h2>
    <div id="history" class="history">
      <span class="green">0</span>
    </div>
  </section>

</main>

<p>
  <a href="index.html">
    <button class="btn-back">ホームに戻る</button>
  </a>
</p>
<footer>
  ROYAL SPIN • エンターテインメント用のルーレット
</footer>

<script>
const REDS = new Set([
  1, 3, 5, 7, 9, 12, 14, 16, 18,
  19, 21, 23, 25, 27, 30, 32, 34, 36
]);

const $ = id => document.getElementById(id);

let spinning = false;
let angle = 0;
let rounds = 0;

let counts = {
  red: 0,
  black: 0,
  green: 0
};

let history = [];
let chosenNumber = null;
let animationId = null;

const canvas = $("wheel");
const ctx = canvas.getContext("2d");

const numbers = [
  0, 32, 15, 19, 4, 21, 2, 25, 17,
  34, 6, 27, 13, 36, 11, 30, 8, 23,
  10, 5, 24, 16, 33, 1, 20, 14, 31,
  9, 22, 18, 29, 7, 28, 12, 35, 3, 26
];

const segment = Math.PI * 2 / numbers.length;

function colorOf(n) {
  if (n === 0) return "green";
  return REDS.has(n) ? "red" : "black";
}

function drawWheel(rotation = angle) {
  const cx = 300;
  const cy = 300;
  const outer = 280;
  const inner = 205;

  ctx.clearRect(0, 0, 600, 600);

  // 外側の金色の枠
  ctx.beginPath();
  ctx.arc(cx, cy, outer + 12, 0, Math.PI * 2);
  ctx.fillStyle = "#d8b455";
  ctx.fill();

  // ルーレットの各数字
  numbers.forEach((n, i) => {
    const start = rotation + i * segment - Math.PI / 2;
    const end = start + segment;
    const color = colorOf(n);

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, outer, start, end);
    ctx.closePath();

    ctx.fillStyle =
      color === "red" ? "#bd252e" :
      color === "black" ? "#171b19" :
      "#087b46";

    ctx.fill();

    ctx.strokeStyle = "#f2d88a";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 数字を描画
    const mid = start + segment / 2;
    const tx = cx + Math.cos(mid) * 242;
    const ty = cy + Math.sin(mid) * 242;

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(mid + Math.PI / 2);

    ctx.fillStyle = "#fff8dc";
    ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(n, 0, 0);

    ctx.restore();
  });

  // 中央の円
  ctx.beginPath();
  ctx.arc(cx, cy, inner, 0, Math.PI * 2);
  ctx.fillStyle = "#0b3828";
  ctx.fill();

  ctx.strokeStyle = "#e9c763";
  ctx.lineWidth = 8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, inner - 17, 0, Math.PI * 2);
  ctx.strokeStyle = "#e9c76388";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 中央のロゴ
  ctx.fillStyle = "#f4d16f";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = "900 32px Georgia, serif";
  ctx.fillText("ROYAL", cx, cy - 12);

  ctx.font = "bold 18px system-ui, sans-serif";
  ctx.fillText("SPIN", cx, cy + 22);
}

function renderNumberChoices() {
  $("numberChoices").innerHTML = [
    0, 7, 17, 23, 32, 36
  ].map(n => `
    <button
      class="chip ${colorOf(n)} ${
        chosenNumber === n ? "selected" : ""
      }"
      data-number="${n}"
    >
      ${n}
    </button>
  `).join("");

  $("numberChoices")
    .querySelectorAll("button")
    .forEach(btn => {
      btn.addEventListener("click", () => {
        if (spinning) return;

        chosenNumber = Number(btn.dataset.number);
        $("prediction").value = "number";

        renderNumberChoices();

        $("predictionMessage").textContent =
          `${chosenNumber} を予想中！`;
      });
    });
}

$("prediction").addEventListener("change", () => {
  chosenNumber = null;
  renderNumberChoices();

  $("predictionMessage").textContent =
    "予想を選んで、ルーレットを回そう！";
});

function matches(n) {
  const p = $("prediction").value;

  if (p === "number") {
    return n === chosenNumber;
  }

  if (["red", "black", "green"].includes(p)) {
    return colorOf(n) === p;
  }

  if (p === "even") {
    return n !== 0 && n % 2 === 0;
  }

  if (p === "odd") {
    return n % 2 === 1;
  }

  if (p === "low") {
    return n >= 1 && n <= 18;
  }

  if (p === "high") {
    return n >= 19 && n <= 36;
  }

  return false;
}

function updateStats() {
  $("rounds").textContent = rounds;

  $("counts").textContent =
    `${counts.red} / ${counts.black} / ${counts.green}`;

  $("history").innerHTML = history.length
    ? history.map(n => `
        <span class="${colorOf(n)}">${n}</span>
      `).join("")
    : '<span class="green">0</span>';
}

function spin() {
  if (spinning) return;

  spinning = true;

  $("spin").disabled = true;
  $("reset").disabled = true;
  $("prediction").disabled = true;

  $("numberChoices")
    .querySelectorAll("button")
    .forEach(b => b.disabled = true);

  $("predictionMessage").textContent =
    "回転中……ボールの行方は？";

  // 今回の結果をランダムに決定
  const winnerIndex = Math.floor(
    Math.random() * numbers.length
  );

  const winner = numbers[winnerIndex];

  // 回転する角度を決める
  const targetAngle =
    Math.PI * 2 * 6 +
    (Math.PI * 2 - (winnerIndex + 0.5) * segment);

  const initial = angle;
  const finalAngle = initial + targetAngle;
  const duration = 4200;
  const startTime = performance.now();

  function frame(now) {
    const t = Math.min(
      1,
      (now - startTime) / duration
    );

    // 徐々に減速する動き
    const eased = 1 - Math.pow(1 - t, 4);

    angle = initial + (finalAngle - initial) * eased;

    drawWheel(angle);

    if (t < 1) {
      animationId = requestAnimationFrame(frame);
    } else {
      angle = angle % (Math.PI * 2);
      drawWheel(angle);
      showResult(winner);
    }
  }

  animationId = requestAnimationFrame(frame);
}

function showResult(n) {
  spinning = false;

  rounds++;
  counts[colorOf(n)]++;

  history.unshift(n);
  history = history.slice(0, 18);

  const color = colorOf(n);

  $("resultNumber").textContent = n;
  $("resultNumber").className = `number ${color}`;

  $("resultColor").textContent =
    color === "red" ? "RED • 赤" :
    color === "black" ? "BLACK • 黒" :
    "GREEN • 緑";

  $("resultText").textContent =
    `今回の結果は ${n}。`;

  $("predictionMessage").textContent = matches(n)
    ? `🎉 的中！ ${n} が出たよ！`
    : `今回ははずれ！ ${n} が出たよ。次も挑戦してみよう！`;

  updateStats();

  $("spin").disabled = false;
  $("reset").disabled = false;
  $("prediction").disabled = false;

  renderNumberChoices();
}

function resetGame() {
  if (animationId) {
    cancelAnimationFrame(animationId);
  }

  spinning = false;
  angle = 0;
  rounds = 0;

  counts = {
    red: 0,
    black: 0,
    green: 0
  };

  history = [];
  chosenNumber = null;

  $("spin").disabled = false;
  $("reset").disabled = false;
  $("prediction").disabled = false;

  $("prediction").value = "red";

  $("resultNumber").textContent = "—";
  $("resultNumber").className = "number";

  $("resultColor").textContent = "スタートを押してね";
  $("resultText").textContent = "0〜36の数字が出るよ。";

  $("predictionMessage").textContent =
    "予想を選んで、ルーレットを回そう！";

  renderNumberChoices();
  updateStats();
  drawWheel(0);
}

$("spin").addEventListener("click", spin);
$("reset").addEventListener("click", resetGame);

resetGame();
</script>

</body>
</html>
